<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerenciador</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1 id="titulo">Gerenciador</h1>
    <p id="status-api" class="status">Conectando à API...</p>
  </header>

  <main class="layout">
    <!-- Formulário: usado para cadastrar (POST) e editar (PUT) -->
    <section class="painel">
      <h2 id="form-titulo">Novo registro</h2>
      <form id="formulario" novalidate>
        <div id="campos"></div>
        <div class="acoes">
          <button type="submit" id="btn-salvar" class="btn primario">Cadastrar</button>
          <button type="button" id="btn-cancelar" class="btn" hidden>Cancelar edição</button>
        </div>
      </form>
    </section>

    <!-- Lista: preenchida com o resultado do GET -->
    <section class="painel">
      <div class="lista-topo">
        <h2>Registros</h2>
        <input type="search" id="busca" placeholder="Buscar na lista...">
      </div>
      <div class="tabela-wrap">
        <table>
          <thead id="cabecalho"></thead>
          <tbody id="corpo"></tbody>
        </table>
      </div>
      <p id="vazio" class="vazio" hidden>Nenhum registro encontrado. Preencha o formulário para cadastrar o primeiro.</p>
    </section>
  </main>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
